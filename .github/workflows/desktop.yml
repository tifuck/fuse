name: desktop-build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

defaults:
  run:
    working-directory: fuse-desktop

# The instance this build wraps (scripts/dist.js): set as repository variables.
env:
  FUSE_URL: ${{ vars.FUSE_URL }}
  FUSE_APP_ID: ${{ vars.FUSE_APP_ID }}

jobs:
  win-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuse-desktop-win-linux
          path: |
            fuse-desktop/dist/*.exe
            fuse-desktop/dist/*.AppImage
            fuse-desktop/dist/*.deb
            fuse-desktop/dist/latest*.yml

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run dist:mac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuse-desktop-mac
          path: |
            fuse-desktop/dist/*.dmg
            fuse-desktop/dist/latest-mac.yml
