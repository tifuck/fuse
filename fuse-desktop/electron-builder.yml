# appId and publish.url are placeholders: scripts/dist.js sets this instance's
# values from site.json (gitignored) or FUSE_APP_ID / FUSE_URL.
appId: com.example.fuse
productName: Fuse
copyright: Fuse

directories:
  output: dist
  buildResources: build

afterPack: scripts/after-pack.js

files:
  - main.js
  - site-preload.js
  - update-notice.js
  - package.json
  - build/icon.png
  - titlebar/**

publish:
  provider: generic
  url: https://fuse.example.com/desktop/

nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  artifactName: Fuse-Setup-${version}.${ext}

dmg:
  writeUpdateInfo: true

deb:
  afterInstall: build/after-install.sh
  fpm:
    - --deb-use-file-permissions

linux:
  icon: build/icon.png
  category: Network
  # Native Wayland on Wayland sessions (X11 elsewhere). Under XWayland the
  # window loses the composer caret when tray apps like Handy update.
  executableArgs:
    - --ozone-platform-hint=auto
  target:
    - AppImage
    - deb

mac:
  icon: build/icon.png
  identity: null
  target:
    - dmg
