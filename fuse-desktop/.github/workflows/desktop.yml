name: desktop-build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  win-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: fuse-desktop-win-linux
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/latest*.yml

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: fuse-desktop-mac
          path: |
            dist/*.dmg
            dist/latest-mac.yml
