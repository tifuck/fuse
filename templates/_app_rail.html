<aside class="chat-history app-rail" id="app-rail" data-app-rail aria-label="Workspace">
  <div class="chat-history-head">
    <a class="chat-brand" href="/chat" aria-label="Fuse home">
      <svg class="chat-brand-mark" viewBox="0 0 512 512" aria-hidden="true"><g fill="currentColor"><rect x="168" y="136" width="66" height="240" rx="16"/><rect x="168" y="136" width="196" height="66" rx="16"/><rect x="168" y="252" width="152" height="58" rx="16"/></g><circle cx="398" cy="164" r="22" fill="var(--steel)"/></svg>
      <span class="chat-brand-word">Fuse</span>
      <span class="chat-brand-caption">Workspace</span>
    </a>
    <button type="button" class="chat-history-collapse" data-rail-toggle aria-label="Toggle sidebar" aria-controls="app-rail" aria-expanded="true" title="Toggle sidebar">
      <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M7.5 4v12" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
    </button>
  </div>
  <nav class="app-rail-nav" aria-label="Pages">
    <p class="app-rail-label">Workspace</p>
    <a href="/usage"{% if path == '/usage' %} class="on" aria-current="page"{% endif %}>Usage</a>
    <a href="/models"{% if path.startswith('/models') %} class="on" aria-current="page"{% endif %}>Models</a>
    <a href="/tasks"{% if path.startswith('/tasks') %} class="on" aria-current="page"{% endif %}>Tasks</a>
    <p class="app-rail-label">Setup</p>
    <a href="/sources"{% if path.startswith('/sources') or path.startswith('/pool') %} class="on" aria-current="page"{% endif %}>Sources</a>
    <a href="/skills"{% if path.startswith('/skills') %} class="on" aria-current="page"{% endif %}>Skills</a>
    <a href="/projects"{% if path.startswith('/hosts') or path.startswith('/projects') %} class="on" aria-current="page"{% endif %}>Machines</a>
    <a href="/artifacts"{% if path.startswith('/artifacts') %} class="on" aria-current="page"{% endif %}>Artifacts</a>
    <a href="/docs"{% if path.startswith('/docs') %} class="on" aria-current="page"{% endif %}>API</a>
    <a href="/download"{% if path.startswith('/download') %} class="on" aria-current="page"{% endif %}>Desktop</a>
    {% if user['is_admin'] %}
    <p class="app-rail-label">Admin</p>
    <a href="/admin/sources"{% if path.startswith('/admin/sources') %} class="on" aria-current="page"{% endif %}>Config</a>
    <a href="/admin/users"{% if path.startswith('/admin/users') %} class="on" aria-current="page"{% endif %}>Users</a>
    {% endif %}
  </nav>
  <div class="chat-history-footer">
    {% include "_account.html" %}
  </div>
  <button type="button" class="chat-history-resize" data-rail-resize role="separator" aria-orientation="vertical" aria-label="Resize sidebar" title="Drag to resize · double-click to reset"></button>
</aside>
