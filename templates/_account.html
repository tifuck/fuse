{% import "_nav.html" as nav %}
{% set email = user['email'] %}
{% set initial = (email[:1] or '?')|upper %}
{% set local = email.split('@')[0] %}
<div class="user-dock" data-account>
  <div class="user-dock-menu" id="account-menu" data-account-menu hidden role="group" aria-label="Account">
    <div class="user-dock-who">
      <span class="user-dock-avatar" aria-hidden="true">{{ initial }}</span>
      <span class="user-dock-copy">
        <strong>{{ local }}</strong>
        <span title="{{ email }}">{{ email }}</span>
        {% if user['is_admin'] %}<em>Admin</em>{% endif %}
      </span>
      <button type="button" class="chat-menu-close user-dock-close" data-account-close aria-label="Close">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>
    <nav class="user-dock-nav">
      {{ nav.nav_links(path, user, "user-dock-label") }}
    </nav>
    <form method="post" action="/logout" class="user-dock-out">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button type="submit">Sign out</button>
    </form>
  </div>
  <button type="button" class="user-dock-btn" data-account-toggle aria-expanded="false" aria-controls="account-menu" title="{{ email }}">
    <span class="user-dock-avatar" aria-hidden="true">{{ initial }}</span>
    <span class="user-dock-copy">
      <strong>{{ local }}</strong>
      <span>{{ email }}</span>
    </span>
    <svg class="user-dock-caret" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M4.2 6.2L8 10l3.8-3.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
</div>
